---

- hosts: all
  become: true
  tasks:

  - name: update repository index
    apt:
      update_cache: yes

  - name: Remove apache2 package with purge
    apt:
      name: apache2
      state: absent
      purge: yes

  - name: Remove php support for apache
    apt:
      name: libapache2-mod-php
      state: absent
      purge: yes

  - name: Remove leftover dependency packages
    apt:
      autoremove: yes
      purge: yes
