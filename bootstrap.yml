---

- hosts: all
  become: true
  pre_tasks:


  - name: install updates (Amazon)
    tags: always
    yum:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Amazon"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"


- hosts: all
  become: true
  tasks:


  - name: create new users
    tags: always
    user:
      name: david
      groups: root

  - name: add ssh key for david
    tags: always
    authorized_key:
        user: david
        key: "ssh-rsa "


  - name: add sudoers file for david
    tags: always
    copy:
       src: sudoer_david
       dest: /etc/sudoers.d/david
       owner: root
       group: root
       mode: 0440

